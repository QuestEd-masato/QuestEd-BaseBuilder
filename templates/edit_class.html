{% extends 'base.html' %}

{% block title %}クラス編集{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>クラス編集</h2>
    <form method="POST" action="{{ url_for('teacher_class_management.edit_class', class_id=class_obj.id) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group mb-3">
            <label for="name">クラス名</label>
            <input type="text" class="form-control" id="name" name="name" value="{{ class_obj.name }}" required>
        </div>
        <div class="form-group mb-3">
            <label for="description">説明</label>
            <textarea class="form-control" id="description" name="description" rows="3">{{ class_obj.description or '' }}</textarea>
        </div>
        <div class="form-group mb-3">
            <label for="subject_id">教科</label>
            <select class="form-control" id="subject_id" name="subject_id">
                <option value="">教科を選択してください</option>
                {% for subject in subjects %}
                <option value="{{ subject.id }}" {% if class_obj.subject_id == subject.id %}selected{% endif %}>
                    {{ subject.name }}
                </option>
                {% endfor %}
            </select>
        </div>
        <!-- 学年・学級フィールド -->
        <div class="row mb-3">
            <div class="col-md-6">
                <label for="grade" class="form-label">対象学年</label>
                <select class="form-control" id="grade" name="grade">
                    <option value="">選択してください</option>
                    {% for grade in range(1, 13) %}
                    <option value="{{ grade }}" {% if class_obj.grade == grade %}selected{% endif %}>
                        {{ grade }}年
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label for="classroom" class="form-label">学級</label>
                <select class="form-control" id="classroom" name="classroom">
                    <option value="">選択してください</option>
                    {% for i in range(1, 7) %}
                    <option value="{{ i }}組" {% if class_obj.classroom == i~'組' %}selected{% endif %}>
                        {{ i }}組
                    </option>
                    {% endfor %}
                    <option value="A組" {% if class_obj.classroom == 'A組' %}selected{% endif %}>A組</option>
                    <option value="B組" {% if class_obj.classroom == 'B組' %}selected{% endif %}>B組</option>
                    <option value="C組" {% if class_obj.classroom == 'C組' %}selected{% endif %}>C組</option>
                </select>
            </div>
        </div>
        <div class="form-group mb-3">
            <label for="schedule">スケジュール</label>
            <input type="text" class="form-control" id="schedule" name="schedule" value="{{ class_obj.schedule or '' }}">
        </div>
        <div class="form-group mb-3">
            <label for="location">場所</label>
            <input type="text" class="form-control" id="location" name="location" value="{{ class_obj.location or '' }}">
        </div>
        <button type="submit" class="btn btn-primary">更新</button>
        <a href="{{ url_for('teacher_class_management.view_class', class_id=class_obj.id) }}" class="btn btn-secondary">キャンセル</a>
    </form>
</div>
{% endblock %}

<!-- ランキングウィジェット（ダッシュボード用） -->
<div class="ranking-widget" data-user-role="{{ current_user.role }}">
    <div class="widget-header">
        <h3>
            <i class="fas fa-trophy"></i>
            {% if current_user.role == 'student' %}学習ランキング{% else %}クラスランキング{% endif %}
        </h3>
        <a href="{% if current_user.role == 'student' %}{{ url_for('student_ranking.ranking') }}{% else %}{{ url_for('teacher_analytics.ranking_analysis') }}{% endif %}" 
           class="widget-link">
            詳細を見る <i class="fas fa-arrow-right"></i>
        </a>
    </div>
    
    <div class="widget-content" id="ranking-widget-content">
        <div class="loading-placeholder">
            <i class="fas fa-spinner fa-spin"></i>
            <span>読み込み中...</span>
        </div>
    </div>
</div>

<style>
.ranking-widget {
    background: transparent;
    border-radius: 0;
    box-shadow: none;
    overflow: visible;
    height: auto;
    max-height: none;
    display: flex;
    flex-direction: column;
    margin: 0;
    padding: 0;
}

/* 高特異性でスクロールバーのスタイルを上書き */
.dashboard-card .ranking-widget::-webkit-scrollbar {
    width: 8px !important;
}

.dashboard-card .ranking-widget::-webkit-scrollbar-track {
    background: #f7fafc !important;
    border-radius: 4px !important;
}

.dashboard-card .ranking-widget::-webkit-scrollbar-thumb {
    background: #cbd5e0 !important;
    border-radius: 4px !important;
}

.dashboard-card .ranking-widget::-webkit-scrollbar-thumb:hover {
    background: #a0aec0 !important;
}

.ranking-widget::-webkit-scrollbar {
    width: 8px;
}

.ranking-widget::-webkit-scrollbar-track {
    background: #f7fafc;
    border-radius: 4px;
}

.ranking-widget::-webkit-scrollbar-thumb {
    background: #cbd5e0;
    border-radius: 4px;
}

.ranking-widget::-webkit-scrollbar-thumb:hover {
    background: #a0aec0;
}

.widget-header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 1rem 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 0 -1.5rem 0 -1.5rem;
    border-radius: 8px;
    flex-shrink: 0;
}

.widget-header h3 {
    margin: 0;
    font-size: 1.1rem;
    font-weight: 600;
}

.widget-link {
    color: white;
    text-decoration: none;
    font-size: 0.9rem;
    opacity: 0.9;
    transition: opacity 0.2s;
}

.widget-link:hover {
    opacity: 1;
    text-decoration: underline;
}

.widget-content {
    flex: 1;
    padding: 1rem 0;
    overflow: visible;
}

.loading-placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: #6b7280;
    flex-direction: column;
    gap: 0.5rem;
}

.my-rank-summary {
    background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
    color: white;
    padding: 1rem;
    border-radius: 8px;
    margin: 0 1rem 1rem 1rem;
    text-align: center;
}

.my-rank-number {
    font-size: 1.5rem;
    font-weight: bold;
    margin-bottom: 0.25rem;
}

.my-rank-details {
    font-size: 0.9rem;
    opacity: 0.9;
}

.ranking-list-container {
    margin: 0 1rem 1rem 1rem;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    background: #f9fafb;
}


.ranking-list {
    list-style: none;
    padding: 0;
    margin: 0;
}

.ranking-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.5rem;
    margin-bottom: 0.25rem;
    border-radius: 4px;
    background: white;
    transition: background 0.2s;
    border: 1px solid #e5e7eb;
}

.ranking-item:hover {
    background: #f3f4f6;
}

.ranking-item.current-user {
    background: #fef3c7;
    border: 2px solid #fbbf24;
}

.student-info {
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.rank-number {
    font-weight: bold;
    color: #374151;
    min-width: 30px;
    text-align: center;
}

.rank-1 { color: #fbbf24; }
.rank-2 { color: #9ca3af; }
.rank-3 { color: #cd7c2f; }

.student-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #667eea;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 0.7rem;
}

.student-name {
    font-weight: 600;
    color: #374151;
    font-size: 0.8rem;
}

.student-score {
    font-weight: 600;
    color: #059669;
    font-size: 0.8rem;
}

.analytics-summary {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin-bottom: 1rem;
}

.stat-card {
    background: #f9fafb;
    padding: 1rem;
    border-radius: 8px;
    text-align: center;
}

.stat-value {
    font-size: 1.5rem;
    font-weight: bold;
    color: #059669;
    margin-bottom: 0.25rem;
}

.stat-label {
    font-size: 0.8rem;
    color: #6b7280;
}

.widget-footer {
    padding: 0.75rem 1rem;
    background: #f8fafc;
    border-top: 1px solid #e5e7eb;
    text-align: center;
    margin: 0 1rem;
    border-radius: 0 0 8px 8px;
}

.update-time {
    font-size: 0.8rem;
    color: #6b7280;
}

.error-message {
    text-align: center;
    color: #dc2626;
    padding: 2rem;
}

.no-data-message {
    text-align: center;
    color: #6b7280;
    padding: 2rem;
}
</style>

<script>
// HTMLエスケープ関数
function escapeHtml(unsafe) {
    if (typeof unsafe !== 'string') return unsafe;
    return unsafe
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

document.addEventListener('DOMContentLoaded', function() {
    loadRankingWidget();
});

async function loadRankingWidget() {
    const widget = document.querySelector('.ranking-widget');
    const content = document.getElementById('ranking-widget-content');
    const userRole = widget.dataset.userRole;
    
    try {
        let scope = 'school';  // 常に学校全体のランキングを表示
        let limit = 10;
        
        const apiUrl = `/api/rankings/total_points?scope=${scope}&limit=${limit}`;
        console.log('Fetching ranking data from:', apiUrl);
        
        const response = await fetch(apiUrl, {
            method: 'GET',
            credentials: 'same-origin',
            headers: {
                'X-Requested-With': 'XMLHttpRequest',
                'Accept': 'application/json',
                'Content-Type': 'application/json'
            }
        });
        
        console.log('Ranking response status:', response.status);
        
        if (response.status === 401 || response.status === 403) {
            window.location.href = '/login';
            return;
        }
        
        if (!response.ok) {
            throw new Error(`Failed to fetch rankings: ${response.status} ${response.statusText}`);
        }
        
        const data = await response.json();
        console.log('Ranking data received:', data);
        
        // 統一されたAPIレスポンス構造を処理
        if (data && data.status === 'success' && data.api_version === '1.0') {
            console.log('Using standardized API response structure v1.0');
            renderRankingWidget({
                rankings: data.rankings || [],
                total_participants: data.total_participants || 0,
                my_rank: data.my_rank,
                my_score: data.my_score,
                last_updated: data.last_updated || new Date().toISOString()
            }, userRole);
        } else if (data && data.status === 'success' && data.rankings) {
            console.log('Using legacy API success response structure');
            renderRankingWidget({
                rankings: data.rankings,
                total_participants: data.total_participants,
                my_rank: data.my_rank,
                my_score: data.my_score,
                last_updated: data.last_updated || new Date().toISOString()
            }, userRole);
        } else {
            console.error('Unexpected ranking data structure:', data);
            content.innerHTML = `<div class="error-message">ランキングデータの形式が正しくありません</div>`;
        }
    } catch (error) {
        console.error('Ranking fetch error:', error);
        content.innerHTML = `<div class="error-message">通信エラー: ${error.message}</div>`;
    }
}

function displayRankings(rankings, fullData) {
    const content = document.getElementById('ranking-widget-content');
    const widget = document.querySelector('.ranking-widget');
    const userRole = widget.dataset.userRole;
    
    console.log('Displaying rankings:', rankings);
    console.log('Full ranking data:', fullData);
    
    if (!rankings || rankings.length === 0) {
        content.innerHTML = '<div class="no-data-message">ランキングデータがありません</div>';
        return;
    }
    
    renderRankingWidget({
        rankings: rankings,
        my_rank: fullData.my_rank,
        analytics: fullData.analytics,
        last_updated: fullData.last_updated || new Date().toISOString()
    }, userRole);
}

function renderRankingWidget(rankingData, userRole) {
    const content = document.getElementById('ranking-widget-content');
    let html = '';
    
    console.log('Rendering ranking widget with data:', rankingData);
    console.log('User role:', userRole);
    
    // 現在のユーザーの順位を取得（API直接レスポンスまたは検索）
    const currentUserId = {{ current_user.id if current_user.is_authenticated else 'null' }};
    let myRank = null;
    
    // API から直接 my_rank が提供されている場合
    if (rankingData.my_rank && rankingData.my_score !== undefined) {
        myRank = {
            rank: rankingData.my_rank,
            score: rankingData.my_score,
            total_participants: rankingData.total_participants || (rankingData.rankings ? rankingData.rankings.length : 0)
        };
    } 
    // ランキングリストから検索
    else if (currentUserId && rankingData.rankings) {
        for (let i = 0; i < rankingData.rankings.length; i++) {
            if (rankingData.rankings[i].student_id === currentUserId) {
                myRank = {
                    rank: rankingData.rankings[i].rank,
                    score: rankingData.rankings[i].score,
                    total_participants: rankingData.total_participants || rankingData.rankings.length
                };
                break;
            }
        }
    }
    
    if (myRank) {
        // 自分のランキング情報を表示（学生・教師共通）
        html += `
            <div class="my-rank-summary">
                <div class="my-rank-number">
                    ${myRank.rank <= 3 ? 
                        (myRank.rank === 1 ? '🥇' : 
                         myRank.rank === 2 ? '🥈' : '🥉') : ''
                    }
                    ${myRank.rank}位
                </div>
                <div class="my-rank-details">
                    スコア: ${Math.floor(myRank.score)}pt | 全${myRank.total_participants}人中
                </div>
            </div>
        `;
    }
    
    if (rankingData.rankings && rankingData.rankings.length > 0) {
        html += '<div class="ranking-list-container"><ul class="ranking-list">';
        
        const displayLimit = Math.min(rankingData.rankings.length, 5);  // トップ5まで表示
        
        for (let i = 0; i < displayLimit; i++) {
            const student = rankingData.rankings[i];
            const isCurrentUser = student.student_id === currentUserId;
            
            html += `
                <li class="ranking-item ${isCurrentUser ? 'current-user' : ''}">
                    <div class="student-info">
                        <div class="rank-number rank-${student.rank <= 3 ? student.rank : ''}">${student.rank}</div>
                        <div class="student-avatar">${student.student_name ? escapeHtml(student.student_name)[0].toUpperCase() : '?'}</div>
                        <div class="student-name">${escapeHtml(student.student_name || student.full_name || student.username) || '不明'}</div>
                    </div>
                    <div class="student-score">${Math.floor(student.score)}pt</div>
                </li>
            `;
        }
        
        html += '</ul></div>';
    } else {
        html += '<div class="no-data-message">ランキングデータがありません</div>';
    }
    
    html += `
        <div class="widget-footer">
            <div class="update-time">
                最終更新: ${new Date(rankingData.last_updated).toLocaleString('ja-JP')}
            </div>
        </div>
    `;
    
    content.innerHTML = html;
}

// 5分ごとに自動更新
setInterval(loadRankingWidget, 300000);
</script>

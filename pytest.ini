[tool:pytest]
# pytest設定ファイル

# テストファイルの発見パターン
python_files = test_*.py *_test.py tests.py
python_classes = Test*
python_functions = test_*

# テストディレクトリ
testpaths = tests

# カバレッジレポート設定
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --strict-config
    --cov=app
    --cov=basebuilder
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-fail-under=80
    --cov-branch

# 実行時フィルター
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*USE_L10N.*:DeprecationWarning
    ignore:.*invalid escape sequence.*:DeprecationWarning

# テストマーカー
markers =
    unit: 単体テスト
    integration: 統合テスト
    security: セキュリティテスト
    e2e: エンドツーエンドテスト
    slow: 実行時間の長いテスト
    auth: 認証関連テスト
    db: データベース関連テスト
    api: API関連テスト
    ui: UI関連テスト

# 並列実行設定
# -n auto でCPUコア数に応じた並列実行
# --dist worksteal で効率的なワーク分散

# 環境変数設定
env =
    TESTING = true
    FLASK_ENV = testing
    SECRET_KEY = test-secret-key-for-testing-only
    WTF_CSRF_ENABLED = false